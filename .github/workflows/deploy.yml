name: Uji (lint, tes, build)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install zstandard  # golden test: hasil TS dibaca ulang oleh scripts/fmfio.py
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.DEPLOY_GH_PAGES == 'true' && '/fmm27-pge-web/' || '/' }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_GH_PAGES == 'true'
        with:
          path: dist

  # Terbit ke GitHub Pages hanya kalau variabel repo DEPLOY_GH_PAGES = true (butuh Pages aktif).
  # Situs utama diterbitkan oleh Cloudflare Pages langsung dari repo.
  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_GH_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
